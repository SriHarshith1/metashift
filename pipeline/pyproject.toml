[project]
name = "metashift"
version = "0.1.0"
description = "Metashift: game patch to meta shift report pipeline"
authors = [
    { name = "kaneki", email = "sriharshithgumparthi1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
metashift = "metashift.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
